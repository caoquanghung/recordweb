<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecordWeb extension settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">RecordWeb extension</p>
      <h1>Recording studio URL</h1>
      <p>Set the RecordWeb URL that should open after you click the extension on a target tab.</p>
      <form id="settings-form">
        <label for="app-url">RecordWeb URL</label>
        <input id="app-url" name="app-url" type="url" required placeholder="https://your-project.vercel.app/">
        <button type="submit">Save URL</button>
        <output id="status" aria-live="polite"></output>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
